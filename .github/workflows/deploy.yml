name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Audit (block on high/critical)
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy datenight-api \
            --source ./backend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Run DB migrations via Cloud SQL Proxy
        run: |
          # Download Cloud SQL proxy
          curl -sL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64 \
            -o /tmp/cloud-sql-proxy && chmod +x /tmp/cloud-sql-proxy

          # Start proxy in background
          /tmp/cloud-sql-proxy "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --port 5433 --quiet &
          PROXY_PID=$!
          sleep 3

          # Run migrations through proxy
          cd backend
          npm ci --ignore-scripts
          DATABASE_URL="postgresql://datenight:${{ secrets.DB_PASS }}@127.0.0.1:5433/datenight" \
            npx prisma migrate deploy

          kill $PROXY_PID || true
