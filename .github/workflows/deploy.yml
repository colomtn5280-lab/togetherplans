name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Audit (block on high/critical)
        run: npm audit --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          printf 'APP_URL: "https://datemeup.app"\nCORS_ORIGIN: "https://datemeup.app,https://togetherplans.app"\n' > /tmp/envvars.yaml
          gcloud run deploy datenight-api \
            --source ./backend \
            --region us-central1 \
            --project project-1af074d7-228e-4a43-bc9 \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file /tmp/envvars.yaml \
            --quiet
          echo "✅ Deployed to Cloud Run. Run migrations manually if schema changed."
