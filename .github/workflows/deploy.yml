name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Audit (block on critical only)
        run: npm audit --audit-level=critical

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy datenight-api \
            --source ./backend \
            --region us-central1 \
            --project project-1af074d7-228e-4a43-bc9 \
            --platform managed \
            --allow-unauthenticated \
            --quiet
          echo "✅ Deployed to Cloud Run. Run migrations manually if schema changed."

      - name: Set non-secret env vars on Cloud Run
        run: |
          gcloud run services update datenight-api \
            --region us-central1 \
            --project project-1af074d7-228e-4a43-bc9 \
            --update-env-vars "FIRECRAWL_API_KEY=fc-152f847e34a440b0b1d5be501c9159f2,STRIPE_SECRET_KEY=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,GCS_BUCKET=datemeup-business-assets,STRIPE_WEBHOOK_SECRET=whsec_L1edGiGNoxSWgUHN6dIsXWvnSsO53BB7"

      - name: Deploy venue-etl Cloud Run Job (image update only — does not execute)
        run: |
          gcloud run jobs deploy venue-etl \
            --source ./backend \
            --dockerfile Dockerfile.etl \
            --region us-central1 \
            --project project-1af074d7-228e-4a43-bc9 \
            --memory 4Gi \
            --cpu 2 \
            --task-timeout 7200 \
            --max-retries 0 \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --quiet \
          && echo "✅ venue-etl job image updated" \
          || echo "⚠ venue-etl job deploy failed (non-blocking)"
