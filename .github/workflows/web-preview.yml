name: Web Preview

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  web-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npx expo export --platform web --output-dir dist
        env:
          APP_ENV: preview
          EXPO_PUBLIC_API_URL: https://api.datemeup.app

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy mobile/dist --project-name=togetherplans --branch=${{ github.head_ref || github.ref_name }}

      - name: Post preview URL to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
              .toLowerCase()
              .replace(/[^a-z0-9-]/g, '-')
              .replace(/-+/g, '-')
              .slice(0, 28);
            const url = `https://${branch}.togetherplans.pages.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🌐 Web Preview Ready\n\n**Branch:** \`${context.payload.pull_request.head.ref}\`\n**Preview URL:** ${url}\n\nOpen in browser or share with Jake for review. Updates automatically on every push.`
            });
