<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Calendar body -->
  <rect x="10" y="20" width="80" height="70" rx="10" ry="10" fill="#aa3bff"/>
  <!-- Calendar top bar (darker shade) -->
  <rect x="10" y="20" width="80" height="24" rx="10" ry="10" fill="#8a22df"/>
  <!-- Fix rounded bottom of top bar -->
