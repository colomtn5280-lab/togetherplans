  <!-- Calendar ring right -->
  <rect x="64" y="12" width="8" height="18" rx="4" ry="4" fill="#6b1bc2"/>
  <!-- Heart shape in center of calendar body -->
  <!-- Heart path centered around 50,62 -->
  <path d="M50,72 C50,72 30,58 30,47 C30,40 35,35 42,37 C45,38 48,40 50,43 C52,40 55,38 58,37 C65,35 70,40 70,47 C70,58 50,72 50,72 Z" fill="white" opacity="0.95"/>
